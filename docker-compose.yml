version: '3.8'

services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    image: abhishek-portfolio:latest
    container_name: abhishek_portfolio
    restart: unless-stopped
    ports:
      # Defaults to port 80; can be overridden via .env (e.g., PORT=8080 when running behind host Nginx reverse proxy)
      - "${PORT:-80}:80"
    environment:
      - NODE_ENV=production
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.50'
        reservations:
          memory: 32M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
