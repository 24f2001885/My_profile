name: Continuous Deployment (CD) - AWS VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy-to-vps:
    name: Deploy to AWS Student EC2 Instance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AWS_EC2_SSH_KEY }}

      - name: Deploy Static Files to VPS Webroot
        run: |
          # 1. Ensure target webroot exists with correct ownership
          ssh -o StrictHostKeyChecking=no ${{ secrets.AWS_EC2_USER }}@${{ secrets.AWS_EC2_HOST }} \
            "sudo mkdir -p /var/www/portfolio && sudo chown -R ${{ secrets.AWS_EC2_USER }}:${{ secrets.AWS_EC2_USER }} /var/www/portfolio"

          # 2. Rsync static assets to EC2 webroot (excluding repository metadata and plan docs)
          rsync -avz --delete \
            --exclude '.git*' \
            --exclude '.github*' \
            --exclude 'plan*' \
            -e "ssh -o StrictHostKeyChecking=no -p ${{ secrets.AWS_SSH_PORT || 22 }}" \
            ./ ${{ secrets.AWS_EC2_USER }}@${{ secrets.AWS_EC2_HOST }}:/var/www/portfolio/

          # 3. Securely generate production .htpasswd for Nginx if secrets are defined
          if [ -n "${{ secrets.DASHBOARD_PASSWORD }}" ]; then
            DASH_USER="${{ secrets.DASHBOARD_USERNAME || 'admin' }}"
            ssh -o StrictHostKeyChecking=no ${{ secrets.AWS_EC2_USER }}@${{ secrets.AWS_EC2_HOST }} \
              "echo '${{ secrets.DASHBOARD_PASSWORD }}' | sudo htpasswd -i -c /etc/nginx/.htpasswd $DASH_USER && sudo chmod 640 /etc/nginx/.htpasswd && sudo chown root:www-data /etc/nginx/.htpasswd"
          fi

          # 4. Reload Host Nginx with zero downtime
          ssh -o StrictHostKeyChecking=no ${{ secrets.AWS_EC2_USER }}@${{ secrets.AWS_EC2_HOST }} \
            "sudo systemctl reload nginx"
          
          echo "🚀 Deployment successfully completed! Site live at https://abhishek4312.info"
