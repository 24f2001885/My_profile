name: Continuous Deployment (CD) - AWS VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy-to-vps:
    name: Deploy to AWS Student EC2 Instance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AWS_SSH_KEY || secrets.AWS_EC2_SSH_KEY || secrets.EC2_SSH_KEY }}

      - name: Deploy Static Files to VPS Webroot & Docker Engine
        run: |
          TARGET_HOST="${{ secrets.AWS_HOST || secrets.AWS_EC2_HOST || secrets.EC2_HOST }}"
          TARGET_USER="${{ secrets.AWS_USER || secrets.AWS_EC2_USER || secrets.EC2_USER || 'ubuntu' }}"
          TARGET_PORT="${{ secrets.AWS_SSH_PORT || secrets.EC2_PORT || 22 }}"

          echo "Initiating deployment to $TARGET_USER@$TARGET_HOST:$TARGET_PORT..."

          # 1. Ensure target webroot exists with correct ownership
          ssh -o StrictHostKeyChecking=no -p $TARGET_PORT $TARGET_USER@$TARGET_HOST \
            "sudo mkdir -p /var/www/portfolio && sudo chown -R $TARGET_USER:$TARGET_USER /var/www/portfolio"

          # 2. Rsync static assets to EC2 webroot (excluding local metadata and plan docs)
          rsync -avz --delete \
            --exclude '.git*' \
            --exclude '.github*' \
            --exclude 'plan*' \
            --exclude 'docker*' \
            --exclude 'Dockerfile' \
            -e "ssh -o StrictHostKeyChecking=no -p $TARGET_PORT" \
            ./ $TARGET_USER@$TARGET_HOST:/var/www/portfolio/

          # 3. Securely generate production .htpasswd for Nginx if secrets are defined
          if [ -n "${{ secrets.DASHBOARD_PASSWORD }}" ]; then
            DASH_USER="${{ secrets.DASHBOARD_USERNAME || 'admin' }}"
            ssh -o StrictHostKeyChecking=no -p $TARGET_PORT $TARGET_USER@$TARGET_HOST \
              "echo '${{ secrets.DASHBOARD_PASSWORD }}' | sudo htpasswd -i -c /etc/nginx/.htpasswd $DASH_USER && sudo chmod 640 /etc/nginx/.htpasswd && sudo chown root:www-data /etc/nginx/.htpasswd"
          fi

          # 4. Set permissions and reload Host Nginx with zero downtime
          ssh -o StrictHostKeyChecking=no -p $TARGET_PORT $TARGET_USER@$TARGET_HOST \
            "sudo chown -R www-data:www-data /var/www/portfolio && sudo chmod -R 755 /var/www/portfolio && sudo systemctl reload nginx"
          
          echo "🚀 Deployment successfully completed! Site live at https://abhishekpathak.site"
