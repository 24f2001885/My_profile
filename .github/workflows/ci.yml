name: Continuous Integration (CI)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  validate-schema-and-assets:
    name: Validate Schema & Asset Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Validation Tools
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema

      - name: Validate portfolio.json against schema.json
        run: |
          python -c "
          import json, jsonschema
          with open('assets/data/portfolio.json', 'r', encoding='utf-8') as pf:
              data = json.load(pf)
          with open('assets/data/schema.json', 'r', encoding='utf-8') as sf:
              schema = json.load(sf)
          jsonschema.validate(instance=data, schema=schema)
          print('✅ Validation PASSED: portfolio.json strictly satisfies schema.json')
          "

      - name: Verify Essential Asset Paths
        run: |
          python -c "
          import os
          required_files = [
              'index.html',
              'dashboard.html',
              'assets/css/style.css',
              'assets/js/main.js',
              'assets/js/dashboard.js',
              'assets/data/portfolio.json',
              'assets/data/schema.json',
              'assets/docs/ABHISHEKPATHAK_CV.pdf',
              'assets/img/hero_portrait_composite.webp',
              'assets/img/hero_portrait_composite_1600w.webp',
              'assets/img/tma-preview.jpg',
              'assets/img/lms-preview.jpg',
              'assets/img/infra-preview.jpg',
              'Dockerfile',
              'docker-compose.yml',
              'nginx.conf'
          ]
          missing = [f for f in required_files if not os.path.exists(f)]
          if missing:
              raise SystemExit(f'❌ Missing essential files: {missing}')
          print(f'✅ All {len(required_files)} essential files verified present.')
          "

  docker-build-check:
    name: Verify Container Build
    runs-on: ubuntu-latest
    needs: validate-schema-and-assets

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Alpine Nginx Docker Image
        run: |
          docker build -t abhishek-portfolio:ci .
          echo "✅ Docker build succeeded: Container image compiles cleanly!"
