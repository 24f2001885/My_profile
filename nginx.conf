server {
    listen 80;
    server_name abhishekpathak.site www.abhishekpathak.site abhishek4312.info www.abhishek4312.info localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Low-memory buffer limits for 1 GB RAM EC2 instance
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    client_max_body_size 8m;
    large_client_header_buffers 2 1k;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Password-Protected Developer Dashboard (Production Web Server Layer)
    location = /dashboard.html {
        auth_basic "Restricted Developer Console";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri =404;
    }

    location = /assets/js/dashboard.js {
        auth_basic "Restricted Developer Console";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri =404;
    }

    # Static Assets Caching (CSS, JS, WebP, PDF)
    location ~* \.(css|js|webp|jpg|jpeg|png|svg|pdf|ico)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # SPA / HTML fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
